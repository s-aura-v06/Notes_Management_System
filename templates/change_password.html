{% extends "base.html" %}

{% block title %}
Change Password
{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="dashboard-card">

        <h2 class="section-title">
            🔐 Change Password
        </h2>

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">
                    Current Password
                </label>

                <input
                    type="password"
                    name="current_password"
                    class="form-control"
                    placeholder="Enter current password"
                    required
                >
            </div>


            <div class="mb-3">
                <label class="form-label">
                    New Password
                </label>

                <input
                    type="password"
                    name="new_password"
                    class="form-control"
                    placeholder="Enter new password"
                    required
                >
            </div>


            <div class="mb-3">
                <label class="form-label">
                    Confirm New Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    class="form-control"
                    placeholder="Confirm new password"
                    required
                >
            </div>


            <button type="submit" class="btn btn-primary">
                🔑 Change Password
            </button>

            <a
                href="{{ url_for('profile') }}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
