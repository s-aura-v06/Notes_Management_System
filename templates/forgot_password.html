{% extends "base.html" %}

{% block title %}
Forgot Password
{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="dashboard-card">

        <h2 class="section-title">
            🔐 Forgot Password
        </h2>

        <p>
            Enter your registered email address to reset your password.
        </p>

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your registered email"
                    required
                >

            </div>

            <button
                type="submit"
                class="btn btn-primary">
                🔑 Reset Password
            </button>

            <a
                href="{{ url_for('login') }}"
                class="btn btn-secondary">
                Back to Login
            </a>

        </form>

    </div>

</div>

{% endblock %}
