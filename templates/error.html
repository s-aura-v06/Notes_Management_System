{% extends "base.html" %}


{% block title %}

Error

{% endblock %}



{% block content %}



<div class="container mt-5">


    <div class="dashboard-card text-center">


        <h1 class="display-1">

            {{ error_code }}

        </h1>



        <h2>

            {{ error_message }}

        </h2>



        <p class="mt-3">

            Sorry, something went wrong.

        </p>



        <a href="{{ url_for('home') }}"
           class="btn btn-primary">

            🏠 Go Home

        </a>



    </div>


</div>



{% endblock %}
