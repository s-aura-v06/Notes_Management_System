{% extends "base.html" %}

{% block title %}
Add Category
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="dashboard-card">

                <h2 class="dashboard-title text-center mb-4">
                    📂 Add New Category
                </h2>

                <p class="text-center text-muted mb-4">
                    Create a new category to organize your notes.
                </p>

                <form method="POST">

                    <!-- Category Name -->

                    <div class="mb-4">

                        <label class="form-label fw-bold">
                            Category Name
                        </label>

                        <input
                            type="text"
                            name="category_name"
                            class="form-control"
                            placeholder="Enter category name..."
                            required
                        >

                    </div>

                    <!-- Buttons -->

                    <div class="d-flex justify-content-between">

                        <a href="{{ url_for('dashboard') }}"
                           class="btn btn-secondary">

                            ← Back

                        </a>

                        <button
                            type="submit"
                            class="btn btn-success">

                            ➕ Save Category

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
